plugins {
    id 'java'
    id 'war'
}

group 'com.example'
version '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

// Spring Framework 6 and Jakarta Servlet 6 require Java 17 or newer.
java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

dependencies {
    // Tomcat 10.1+ supplies these APIs when deploying the WAR.
    compileOnly('jakarta.servlet:jakarta.servlet-api:6.1.0')
    compileOnly('jakarta.servlet.jsp:jakarta.servlet.jsp-api:3.1.1')

    // Spring 6 uses the Jakarta Servlet namespace.
    implementation('org.springframework:spring-webmvc:6.2.0')

    // JSTL 3 for Tomcat 10.1+ and the jakarta.tags.core URI used in index.jsp.
    implementation('jakarta.servlet.jsp.jstl:jakarta.servlet.jsp.jstl-api:3.0.0')
    implementation('org.glassfish.web:jakarta.servlet.jsp.jstl:3.0.1')
}
